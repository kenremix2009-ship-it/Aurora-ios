name: Build Unsigned IPA for ESign

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Find Project and Scheme
      run: |
        echo "Searching for project/workspace..."
        find . -maxdepth 3 -name "*.xcworkspace" -o -name "*.xcodeproj"
        
        # Tự động chọn xcworkspace hoặc xcodeproj đầu tiên tìm thấy
        TARGET_FILE=$(find . -maxdepth 3 -name "*.xcworkspace" -o -name "*.xcodeproj" | head -n 1)
        echo "Selected target: $TARGET_FILE"
        
        echo "TARGET_FILE=$TARGET_FILE" >> $GITHUB_ENV

    - name: Build Unsigned Archive
      run: |
        TARGET="${{ env.TARGET_FILE }}"
        
        if [[ "$TARGET" == *.xcworkspace ]]; then
          FLAG="-workspace"
          SCHEME=$(basename "$TARGET" .xcworkspace)
        else
          FLAG="-project"
          SCHEME=$(basename "$TARGET" .xcodeproj)
        fi
        
        echo "Using flag: $FLAG, target: $TARGET, scheme: $SCHEME"

        xcodebuild clean archive \
          $FLAG "$TARGET" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $RUNNER_TEMP/app.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r $RUNNER_TEMP/app.xcarchive/Products/Applications/*.app Payload/
        zip -r Aurora_Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aurora-Unsigned-IPA
        path: Aurora_Unsigned.ipa