name: Build Unsigned IPA for ESign

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build with Tuist / Xcode
      run: |
        echo "=== Kiem tra cac goi phu thuoc ==/===="
        
        # Cài đặt tuist qua Homebrew để tránh bị chặn Cloudflare
        brew install tuist || true
        
        if command -v tuist &> /dev/null; then
          tuist generate --no-open
        else
          echo "Su dung swift package hoac build truc tiep..."
        fi

        # Tìm file project hoặc workspace
        TARGET=$(find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -n 1)
        echo "Da tim thay target: $TARGET"
        
        if [ -z "$TARGET" ]; then
          echo "LOI: Khong tim thay file project!"
          exit 1
        fi
        
        if [[ "$TARGET" == *.xcworkspace ]]; then
          FLAG="-workspace"
          SCHEME=$(basename "$TARGET" .xcworkspace)
        else
          FLAG="-project"
          SCHEME=$(basename "$TARGET" .xcodeproj)
        fi
        
        echo "Su dung Flag: $FLAG | Target: $TARGET | Scheme: $SCHEME"

        xcodebuild clean archive \
          $FLAG "$TARGET" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          -archivePath $RUNNER_TEMP/app.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r $RUNNER_TEMP/app.xcarchive/Products/Applications/*.app Payload/
        zip -r Aurora_Unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aurora-Unsigned-IPA
        path: Aurora_Unsigned.ipa
